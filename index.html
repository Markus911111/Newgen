<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newgen RPG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <div id="start-screen" class="container">
        <h1>Newgen RPG</h1>
        <p>A telltale-style adventure awaits.</p>
        <button id="start-btn" type="button" class="btn primary">
          Start Game
        </button>
      </div>

      <div id="game-container" hidden>
        <div id="narrative-text" aria-live="polite"></div>
        <div id="choices" class="choices-container"></div>
      </div>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
